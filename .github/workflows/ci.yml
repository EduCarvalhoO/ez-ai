# CI do projeto (docs/guias/padrao-de-codigo-e-testes.md). Endurecimento conferido por test/ferramental/ci.test.ts.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Token só de leitura; nenhum job pede mais.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução antiga; na main cada push roda até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: commits:check compara com origin/<base>.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          # Sem isto o runner usa a versão em cache da imagem, que pode estar atrás da última correção.
          check-latest: true
          # Sem cache de pacotes: o setup-node o ligaria sozinho se o package.json ganhar packageManager.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # Qualquer vulnerabilidade conhecida falha, inclusive em dependência de desenvolvimento (roda no CI).
      - run: npm audit
      # Assinaturas do registro (e atestados de provenance, quando houver) de todo pacote instalado.
      # --min-release-age=0: o npm 11 aplica a idade mínima também a esta consulta e falha com transitiva
      # recente já instalada (corrigido no npm 12); a idade é conferida no passo seguinte.
      - run: npm audit signatures --min-release-age=0
      - name: Idade mínima das versões novas do lockfile
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/verificar-idade-deps.mjs --desde "origin/$BASE_REF"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: node .claude/skills/validar-docs/validar.mjs
      - name: Conventional Commits do PR
        if: github.event_name == 'pull_request'
        # base_ref via env, nunca interpolado no script (evita injeção pelo nome do branch).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run commits:check -- "origin/$BASE_REF..HEAD"

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Versão publicada há 7 dias ou mais; SHA-256 de actionlint_<versão>_checksums.txt da release.
      ACTIONLINT_VERSAO: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (sintaxe e expressões dos workflows; usa o shellcheck do runner)
        run: |
          arquivo="actionlint_${ACTIONLINT_VERSAO}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --output "$RUNNER_TEMP/$arquivo"             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSAO}/$arquivo"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$arquivo" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (segurança dos workflows e do dependabot.yml)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --require-hashes --only-binary :all: --no-deps -r .github/zizmor/requirements.txt
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --format=github .

  testes:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Majors de engines.node no package.json; o piso exato entra pelo include.
        node: ['22.x', '24.x']
        include:
          - os: ubuntu-latest
            node: '22.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # Última correção para 22.x/24.x; no piso exato (22.12.0) não muda a versão resolvida.
          check-latest: true
          # Sem cache de pacotes: o setup-node o ligaria sozinho se o package.json ganhar packageManager.
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
