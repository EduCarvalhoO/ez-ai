# Análise estática do CodeQL (docs/guias/padrao-de-codigo-e-testes.md §5). Conferido por
# test/ferramental/seguranca.test.ts. Gratuito porque o repositório é público.
name: CodeQL

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Toda segunda-feira, para pegar consultas novas do CodeQL mesmo sem push.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Único job do projeto com escrita: envia os resultados para a aba Security.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
