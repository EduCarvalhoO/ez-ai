# Publica o ez-ai no npm com provenance (prova de qual workflow gerou o pacote) por OIDC
# (trusted publishing: o npm confia no workflow, então não há token guardado nos Secrets).
# Antes da primeira tag: no npm, Settings do pacote ez-ai > Trusted publisher, apontar para este repositório e este arquivo;
# criar o ambiente `release` com aprovação do Eduardo; tirar `"private": true` do package.json no PR de release.
name: release-npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: release          # ambiente com aprovação manual do Eduardo
    permissions:
      contents: write             # criar a release no GitHub
      id-token: write             # OIDC: é ele que o npm confere
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm test
      - name: A tag bate com a versão do package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run sbom
      - run: npm pack
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.tgz'
      - name: Publicar com provenance
        run: npm publish --provenance --access public
      - name: Release no GitHub com SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes sbom.cdx.json *.tgz
