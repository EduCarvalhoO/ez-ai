# Atualizações de dependências (docs/guias/padrao-de-codigo-e-testes.md §1 e §5). Conferido por
# test/ferramental/seguranca.test.ts. O cooldown espera 7 dias depois da publicação, a mesma
# idade mínima do .npmrc; o prefixo gera mensagens aceitas pelo commits:check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Version updates na develop (ADR-0013); security updates vão sempre para a branch padrão, que é a develop.
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    # Tipos do Node no major do piso de engines.node (ADR-0010): tipos de um major maior aceitariam
    # API ausente no piso. Conferido por test/ferramental/seguranca.test.ts.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    # Version updates na develop (ADR-0013); security updates vão sempre para a branch padrão, que é a develop.
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope

  # zizmor do job workflows (.github/zizmor/requirements.txt, com hashes).
  - package-ecosystem: pip
    directory: /.github/zizmor
    # Version updates na develop (ADR-0013); security updates vão sempre para a branch padrão, que é a develop.
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
