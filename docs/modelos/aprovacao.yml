# MODELO do job de servidor (ADR-0028) para um projeto que usa o harness: copie para .github/workflows/aprovacao.yml
# e proteja o arquivo com CODEOWNERS e ruleset. Não roda neste repositório (o ez-ai não tem .harness/ próprio).
# Ajuste HARNESS_VERSAO (versão fixa do pacote harness-ai) e CHECKS (nomes dos jobs do CI que devem estar verdes).
name: Aprovação própria

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Review novo ou dispensado reconta os aprovadores.
  pull_request_review:
    types: [submitted, dismissed]
  # Pega merge por bypass de admin: o push à branch protegida é conferido contra o commit anterior.
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  HARNESS_VERSAO: '0.0.0' # troque pela versão publicada do harness-ai
  CHECKS: 'qualidade,workflows'

jobs:
  aprovacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: a base é lida por `git ls-tree`/`git show` na ref resolvida.
          fetch-depth: 0
          persist-credentials: false
          path: projeto
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      # O harness vem do npm em versão fixa, nunca do código do PR: o agente não troca a regra que o confere.
      - name: Instala o harness-ai em versão fixa (sem scripts)
        run: npm install --ignore-scripts --no-save --prefix "$RUNNER_TEMP/h" "harness-ai@$HARNESS_VERSAO"
      - name: Confere aprovadores, policy e CI contra a base
        working-directory: projeto
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENTO" = push ]; then
            args=(--base "$ANTES" --sha "$SHA")
          else
            # --sha: a head do evento; se o PR andou depois do checkout, o job falha e roda de novo.
            args=(--base "origin/$BASE_REF" --pr "$PR_NUMBER" --sha "$HEAD_SHA")
          fi
          node "$RUNNER_TEMP/h/node_modules/harness-ai/dist/cli/index.js" validate --servidor \
            --repo "$GITHUB_REPOSITORY" "${args[@]}" --exigir-evidencias --checks "$CHECKS"
